<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- PURE WHITE BACKGROUND -->
  <rect width="1000" height="1000" fill="#FFFFFF" />

  <defs>
    <!-- TOP FACE GRADIENT: Bright lime-green transitioning diagonally to deep forest emerald -->
    <linearGradient id="topFaceGrad" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="25%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- LEFT FACE GRADIENT: Deep rich dark pine / dark teal green -->
    <linearGradient id="leftFaceGrad" x1="5%" y1="10%" x2="95%" y2="90%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="40%" stop-color="#044e39" />
      <stop offset="80%" stop-color="#023829" />
      <stop offset="100%" stop-color="#01241a" />
    </linearGradient>

    <!-- RIGHT FACE GRADIENT: Dark teal green to deep forest -->
    <linearGradient id="rightFaceGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#04684c" />
      <stop offset="50%" stop-color="#034835" />
      <stop offset="100%" stop-color="#012b1f" />
    </linearGradient>

    <!-- LEAF LEFT HALF: Bright luminous fresh spring green -->
    <linearGradient id="leafLeftGrad" x1="25%" y1="10%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="25%" stop-color="#4ade80" />
      <stop offset="65%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- LEAF RIGHT HALF: Shaded deep forest green -->
    <linearGradient id="leafRightGrad" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="45%" stop-color="#15803d" />
      <stop offset="80%" stop-color="#0f5128" />
      <stop offset="100%" stop-color="#053316" />
    </linearGradient>

    <!-- AMBER / ORANGE 3D SPHERES: Golden Yellow to Rich Warm Orange -->
    <radialGradient id="sphereGrad1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>

    <linearGradient id="stemGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="stemGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <g id="exact-logo-symbol">
    <!-- 1. TOP ISOMETRIC FACE (Parallelogram with softly rounded corners) -->
    <path d="M 508,198
             C 522,190 540,192 554,201
             L 662,267
             C 676,276 680,292 671,305
             L 458,414
             C 444,421 428,421 414,414
             L 272,342
             C 258,335 255,319 265,307
             L 472,203
             C 483,197 496,195 508,198 Z"
          fill="url(#topFaceGrad)" />

    <!-- 2. LEFT BOX PANEL (Deep Teal, outer vertical profile + concave leaf boundary) -->
    <path d="M 235,360
             C 220,370 213,386 213,404
             L 213,596
             C 213,644 246,692 288,716
             L 384,772
             C 392,776 401,770 398,761
             C 362,698 334,622 334,540
             C 334,484 352,434 382,388
             C 388,379 382,367 371,368
             L 255,360
             C 248,360 241,360 235,360 Z"
          fill="url(#leftFaceGrad)" />

    <!-- 3. RIGHT BOX PANEL (Dark Teal outer wrapper with curved inner border) -->
    <path d="M 622,416
             C 628,422 628,432 622,438
             C 605,458 594,484 594,514
             C 594,612 648,690 722,720
             C 700,764 654,792 602,792
             C 544,792 494,770 464,734
             L 468,722
             C 486,696 524,630 524,544
             C 524,476 498,428 484,414
             C 478,408 484,398 493,400
             L 622,416 Z"
          fill="url(#rightFaceGrad)" />

    <path d="M 622,416
             L 728,474
             C 742,482 748,498 748,514
             L 748,652
             C 748,692 724,730 690,750
             L 556,824
             C 532,838 502,838 478,824
             L 464,734
             C 502,768 554,788 602,788
             C 650,788 692,756 712,718
             L 740,524
             C 740,510 734,498 722,490
             L 622,416 Z"
          fill="url(#rightFaceGrad)" />

    <!-- 4. ORGANIC FRESH GREEN LEAF (Centered with dual-tone shading) -->
    <!-- Right Shaded Half -->
    <path d="M 440,782
             C 455,716 498,648 498,536
             C 498,464 472,412 458,390
             C 464,394 484,424 494,472
             C 510,548 492,668 440,782 Z"
          fill="url(#leafRightGrad)" />

    <!-- Left Vibrant Blade -->
    <path d="M 458,390
             C 420,440 372,512 372,596
             C 372,684 406,752 440,782
             C 440,782 492,660 492,536
             C 492,464 472,412 458,390 Z"
          fill="url(#leafLeftGrad)" />

    <!-- Leaf Center Crease Spine -->
    <path d="M 458,390 C 476,460 482,560 440,782"
          fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" opacity="0.35" />

    <!-- 5. 3D AMBER/ORANGE AI SENSOR MOLECULE (Exact 2 branches from corner node) -->
    <g id="amber-ai-sensor">
      <!-- Arm 1: Anchor Node to Top Node -->
      <path d="M 612,364 L 702,298"
            stroke="url(#stemGrad1)" stroke-width="26" stroke-linecap="round" />

      <!-- Arm 2: Anchor Node to Right Node (NO cross bar between top and right nodes) -->
      <path d="M 612,364 L 744,402"
            stroke="url(#stemGrad2)" stroke-width="26" stroke-linecap="round" />

      <!-- Node 1: Anchor Sphere -->
      <circle cx="612" cy="364" r="35" fill="url(#sphereGrad1)" />
      <circle cx="602" cy="354" r="8" fill="#FFFFFF" opacity="0.8" />

      <!-- Node 2: Top Right Sphere -->
      <circle cx="702" cy="298" r="34" fill="url(#sphereGrad1)" />
      <circle cx="692" cy="288" r="7.5" fill="#FFFFFF" opacity="0.85" />

      <!-- Node 3: Bottom Right Sphere -->
      <circle cx="744" cy="402" r="38" fill="url(#sphereGrad1)" />
      <circle cx="732" cy="390" r="9" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>
</svg>
