<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#FFFFFF" />
  <defs>
    <!-- Left Clamshell Fold -->
    <linearGradient id="c2_leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="70%" stop-color="#04382A" />
      <stop offset="100%" stop-color="#02241B" />
    </linearGradient>

    <!-- Right Clamshell Fold -->
    <linearGradient id="c2_rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <!-- Central Negative Space Leaf Form -->
    <linearGradient id="c2_leafCore" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber AI Node -->
    <linearGradient id="c2_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <g transform="translate(400, 400)">
    <!-- Primary Outer Protective Curved Clamshell (Left) -->
    <path d="M -40,-220
             C 60,-220 180,-140 180,-20
             C 180,60 140,140 70,195
             C 25,230 -20,240 -80,240
             C -140,240 -195,200 -210,140
             C -220,100 -215,20 -185,-60
             C -155,-140 -100,-220 -40,-220 Z"
          fill="none" />

    <!-- Left Protective Shield Wing -->
    <path d="M -40,-220
             C -120,-210 -190,-130 -200,-30
             C -210,70 -160,170 -90,215
             C -40,245 20,245 70,225
             C 40,210 10,180 -10,140
             C -40,80 -45,0 -30,-80
             C -20,-140 -25,-190 -40,-220 Z"
          fill="url(#c2_leftWing)" />

    <!-- Right Protective Shield Wing -->
    <path d="M 60,-190
             C 140,-150 190,-70 190,30
             C 190,130 130,210 40,230
             C 10,215 -10,185 -10,140
             C -10,60 40,-20 50,-100
             C 55,-140 55,-170 60,-190 Z"
          fill="url(#c2_rightWing)" />

    <!-- Negative Space Center Leaf -->
    <path d="M -15,-180
             C 30,-110 50,-30 30,50
             C 15,110 -20,160 -50,190
             C -45,130 -40,50 -15,-40
             C -5,-100 -10,-150 -15,-180 Z"
          fill="url(#c2_leafCore)" />

    <!-- AI Decision Nodes at the Top Hinge (2 Nodes) -->
    <line x1="50" y1="-190" x2="110" y2="-215" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" />
    <circle cx="50" cy="-190" r="18" fill="url(#c2_amber)" />
    <circle cx="110" cy="-215" r="22" fill="url(#c2_amber)" />
    <circle cx="105" cy="-220" r="6" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
