<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#FFFFFF" />
  <defs>
    <linearGradient id="c3_facetMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#04382A" />
      <stop offset="100%" stop-color="#02241B" />
    </linearGradient>
    <linearGradient id="c3_facetFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="c3_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="c3_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <g transform="translate(400, 400)">
    <!-- Stand-Up Barrier Pouch Geometry: Faceted Packaging Polygon -->
    <!-- Top Barrier Seal Flap -->
    <path d="M -160,-200 L 120,-200 C 135,-200 145,-190 140,-175 L 110,-120 L -130,-120 L -165,-185 C -170,-195 -165,-200 -160,-200 Z" fill="url(#c3_facetFlap)" />

    <!-- Left Structural Facet -->
    <path d="M -130,-120 L -25,-120 L -80,180 C -85,200 -105,215 -125,215 L -170,215 C -195,215 -215,190 -210,165 L -165,-80 C -160,-105 -145,-120 -130,-120 Z" fill="url(#c3_facetMain)" />

    <!-- Right Structural Facet -->
    <path d="M 110,-120 L 150,-50 C 160,-30 160,20 145,80 L 115,180 C 105,205 85,215 65,215 L 20,215 C 35,170 50,110 50,40 C 50,-20 40,-80 25,-120 L 110,-120 Z" fill="url(#c3_facetMain)" />

    <!-- Center Fold Carved Leaf Motif -->
    <path d="M 0,-120 C 35,-60 40,20 20,100 C 0,160 -40,200 -70,220 C -45,170 -30,100 -30,30 C -30,-40 -15,-90 0,-120 Z" fill="url(#c3_leaf)" />

    <!-- AI Nodes at Top Seal Corner (3 Nodes) -->
    <line x1="120" y1="-200" x2="180" y2="-170" stroke="#F59E0B" stroke-width="9" stroke-linecap="round" />
    <line x1="180" y1="-170" x2="160" y2="-110" stroke="#F59E0B" stroke-width="9" stroke-linecap="round" />
    <circle cx="120" cy="-200" r="16" fill="url(#c3_amber)" />
    <circle cx="180" cy="-170" r="19" fill="url(#c3_amber)" />
    <circle cx="160" cy="-110" r="15" fill="url(#c3_amber)" />
  </g>
</svg>
