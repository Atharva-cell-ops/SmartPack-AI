<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Primary: Deep Forest Green to Dark Teal (Protective Structure) -->
    <linearGradient id="c1_primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="55%" stop-color="#0D3B36" />
      <stop offset="100%" stop-color="#0F2942" />
    </linearGradient>

    <!-- Accent: Fresh Emerald to Vivid Leaf Green (Food / Organic) -->
    <linearGradient id="c1_accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Highlight: Warm Golden Amber for AI Decision Points -->
    <linearGradient id="c1_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Secondary Soft Teal Tint for Depth -->
    <linearGradient id="c1_tealFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2F35" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>

  <!-- 1. Left Protective Package Facet (Deep Forest / Teal) -->
  <path d="M 52,68 
           C 52,48 68,36 88,36 
           L 126,36 
           L 126,140 
           C 96,140 68,124 54,98 
           C 52,94 52,80 52,68 Z"
        fill="url(#c1_primary)" />

  <!-- 2. Lower Package Base & Protective Wrap -->
  <path d="M 52,88 
           L 52,172 
           C 52,198 70,220 98,220 
           L 158,220 
           C 186,220 204,198 204,172 
           L 204,146 
           C 182,152 158,162 134,168 
           C 104,176 74,166 58,146 
           C 54,140 52,116 52,88 Z"
        fill="url(#c1_tealFacet)" />

  <!-- 3. Right Organic Leaf Facet (Fresh Green) -->
  <path d="M 204,168 
           C 204,192 188,206 166,206 
           L 128,206 
           L 128,104 
           C 156,104 182,118 198,142 
           C 202,148 204,158 204,168 Z"
        fill="url(#c1_accent)" />

  <!-- 4. Upper Organic Sprout Facet (Completing the Box / Pouch closure) -->
  <path d="M 204,148 
           L 204,84 
           C 204,58 186,36 158,36 
           L 98,36 
           C 120,52 144,72 154,98 
           C 174,86 192,84 204,88 Z"
        fill="url(#c1_accent)" />

  <!-- 5. Negative Space Fresh Leaf Core -->
  <path d="M 88,68 
           C 118,68 152,90 166,124 
           C 166,154 138,186 108,186 
           C 78,186 66,152 66,124 
           C 66,96 76,68 88,68 Z" 
        fill="#FFFFFF" />

  <path d="M 88,72 
           C 114,76 142,96 154,126 
           C 140,152 116,174 96,176 
           C 78,160 74,136 76,116 
           C 78,96 82,80 88,72 Z" 
        fill="url(#c1_accent)" opacity="0.9" />

  <!-- Leaf Spine subtle contour -->
  <path d="M 82,150 C 98,136 118,116 138,94" 
        fill="none" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

  <!-- ================= SUBTLE AI INTELLIGENCE NODES (3 Precision Points) ================= -->
  <!-- Micro network line linking packaging vertices to the leaf core -->
  <line x1="88" y1="50" x2="138" y2="76" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.8" />
  <line x1="138" y1="76" x2="176" y2="50" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />

  <!-- Node 1: Intelligence Junction (Warm Amber) -->
  <circle cx="138" cy="76" r="6.5" fill="url(#c1_amber)" />
  <circle cx="138" cy="76" r="2.5" fill="#FFFFFF" />

  <!-- Node 2: Food Analysis Point (Fresh Emerald) -->
  <circle cx="88" cy="50" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.8" />

  <!-- Node 3: Packaging Calibration Point (Amber Highlight) -->
  <circle cx="176" cy="50" r="5" fill="url(#c1_amber)" stroke="#FFFFFF" stroke-width="1.8" />
</svg>