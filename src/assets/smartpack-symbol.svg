<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Face Gradient: Bright Emerald to Deep Teal -->
    <linearGradient id="cubeTopGrad" x1="28%" y1="12%" x2="72%" y2="88%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#04684c" />
    </linearGradient>

    <!-- Left Box Panel Gradient: Deep Dark Teal/Pine -->
    <linearGradient id="cubeLeftGrad" x1="0%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#03483b" />
      <stop offset="50%" stop-color="#023329" />
      <stop offset="100%" stop-color="#01221b" />
    </linearGradient>

    <!-- Right Box Panel Gradient: Dark Teal to Forest -->
    <linearGradient id="cubeRightGrad" x1="20%" y1="20%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#065846" />
      <stop offset="60%" stop-color="#023a2f" />
      <stop offset="100%" stop-color="#01241d" />
    </linearGradient>

    <!-- Leaf Left Half: Fresh Lime/Emerald -->
    <linearGradient id="leafLeftGrad" x1="15%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Leaf Right Half: Deep Rich Green Shadow -->
    <linearGradient id="leafRightGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="70%" stop-color="#0f6730" />
      <stop offset="100%" stop-color="#0a4d23" />
    </linearGradient>

    <!-- Network Connectors & Spheres: Golden Amber to Warm Orange 3D -->
    <linearGradient id="nodeBarGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="nodeBarGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Sphere 3D Radial Gradients -->
    <radialGradient id="sphereGradTop" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <radialGradient id="sphereGradMid" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <radialGradient id="sphereGradBot" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Soft drop shadow for nodes -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b45309" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. TOP ISOMETRIC FACE (Angled Box Flap with subtle rounded corners) -->
  <path d="M 264,100
           C 272,96 280,96 288,101
           L 336,128
           C 344,133 346,141 341,148
           L 242,201
           C 234,205 224,205 216,201
           L 142,160
           C 134,155 133,146 138,140
           L 240,103
           C 248,100 256,98 264,100 Z"
        fill="url(#cubeTopGrad)" />

  <!-- 2. LEFT BOX PANEL (Deep Teal rounded isometric face) -->
  <path d="M 124,178
           C 114,184 108,194 108,206
           L 108,310
           C 108,338 126,366 150,380
           L 205,412
           C 209,414 213,411 211,407
           C 186,368 171,320 171,270
           C 171,248 178,228 190,210
           L 208,188
           C 212,183 209,176 203,178
           L 124,178 Z"
        fill="url(#cubeLeftGrad)" />

  <!-- 3. RIGHT BOX PANEL (Dark Teal outer wrapper with white channel boundary) -->
  <path d="M 318,212
           C 321,215 321,220 318,224
           C 310,236 304,250 304,266
           C 304,324 336,370 382,388
           C 370,412 342,428 312,428
           C 280,428 252,416 236,396
           L 237,390
           C 248,375 272,335 272,285
           C 272,246 256,220 248,212
           C 245,208 248,202 254,204
           L 318,212 Z"
        fill="url(#cubeRightGrad)" />

  <!-- Full right wrap-around shape to complete the hexagonal profile -->
  <path d="M 318,212
           L 374,242
           C 382,246 386,255 386,264
           L 386,346
           C 386,370 372,392 352,404
           L 280,446
           C 264,455 244,455 228,446
           L 236,396
           C 256,416 288,428 316,428
           C 346,428 372,408 382,384
           L 382,268
           C 382,260 378,252 370,248
           L 318,212 Z"
        fill="url(#cubeRightGrad)" />

  <!-- 4. WHITE SEPARATION CHANNEL (Negative space giving the fresh organic feel) -->
  <path d="M 172,270
           C 172,330 196,385 225,424
           C 227,427 231,426 232,422
           C 238,390 262,352 262,290
           C 262,242 245,214 235,202
           C 232,198 226,199 224,204
           C 202,238 172,250 172,270 Z"
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 5. NESTED FRESH GREEN LEAF (In the front cutout) -->
  <!-- Leaf Right Half (Rich Forest/Medium Green) -->
  <path d="M 225,422
           C 232,385 258,348 258,285
           C 258,245 244,216 235,204
           C 238,206 250,224 256,252
           C 265,296 254,360 225,422 Z"
        fill="url(#leafRightGrad)" />

  <!-- Leaf Left Half (Vibrant Lime/Emerald Green Curved Blade) -->
  <path d="M 235,204
           C 214,232 188,272 188,318
           C 188,368 206,406 225,422
           C 225,422 254,355 254,285
           C 254,245 242,216 235,204 Z"
        fill="url(#leafLeftGrad)" />

  <!-- Leaf Center Crease/Spine -->
  <path d="M 235,204
           C 246,242 250,300 225,422"
        fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />

  <!-- 6. TOP-RIGHT ORANGE CONNECTED NETWORK (Smart AI / Sensor Molecule) -->
  <g filter="url(#nodeGlow)">
    <!-- Connecting Bar 1: Main Node to Top Node -->
    <path d="M 315,190 L 362,152"
          stroke="url(#nodeBarGrad1)" stroke-width="14" stroke-linecap="round" />

    <!-- Connecting Bar 2: Main Node to Bottom Node -->
    <path d="M 315,190 L 388,212"
          stroke="url(#nodeBarGrad2)" stroke-width="14" stroke-linecap="round" />

    <!-- Secondary Cross Bar between outer nodes (matching the network triangle) -->
    <path d="M 362,152 L 388,212"
          stroke="url(#nodeBarGrad1)" stroke-width="11" stroke-linecap="round" />

    <!-- Middle/Anchor Sphere Node (Closest to box vertex) -->
    <circle cx="315" cy="190" r="19" fill="url(#sphereGradMid)" />
    <!-- Specular reflection highlight -->
    <circle cx="310" cy="184" r="5" fill="#FFFFFF" opacity="0.65" />

    <!-- Top-Right Sphere Node -->
    <circle cx="362" cy="152" r="18" fill="url(#sphereGradTop)" />
    <!-- Specular reflection highlight -->
    <circle cx="357" cy="146" r="4.5" fill="#FFFFFF" opacity="0.75" />

    <!-- Bottom-Right Sphere Node -->
    <circle cx="388" cy="212" r="21" fill="url(#sphereGradBot)" />
    <!-- Specular reflection highlight -->
    <circle cx="382" cy="205" r="5.5" fill="#FFFFFF" opacity="0.7" />
  </g>
</svg>
