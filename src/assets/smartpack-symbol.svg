<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- PURE WHITE BACKGROUND - ZERO CONTAINER / ZERO BORDER -->
  <rect width="1000" height="1000" fill="#FFFFFF" />

  <defs>
    <!-- TOP PARALLELOGRAM FACE GRADIENT: Light Emerald to Deep Teal -->
    <linearGradient id="topFaceGradient" x1="22%" y1="12%" x2="78%" y2="88%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="30%" stop-color="#1db954" />
      <stop offset="65%" stop-color="#0e834d" />
      <stop offset="100%" stop-color="#04563a" />
    </linearGradient>

    <!-- LEFT BOX PANEL GRADIENT: Deep Rich Pine / Dark Forest Teal -->
    <linearGradient id="leftFaceGradient" x1="5%" y1="15%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#045647" />
      <stop offset="45%" stop-color="#02382e" />
      <stop offset="85%" stop-color="#01241d" />
      <stop offset="100%" stop-color="#001813" />
    </linearGradient>

    <!-- RIGHT BOX PANEL GRADIENT: Deep Teal to Dark Forest -->
    <linearGradient id="rightFaceGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#076757" />
      <stop offset="50%" stop-color="#034439" />
      <stop offset="100%" stop-color="#012822" />
    </linearGradient>

    <!-- LEAF LEFT HALF: Bright Fresh Lime & Spring Emerald -->
    <linearGradient id="leafLeftGradient" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#5be246" />
      <stop offset="35%" stop-color="#32cd32" />
      <stop offset="70%" stop-color="#1faa3a" />
      <stop offset="100%" stop-color="#0e7c27" />
    </linearGradient>

    <!-- LEAF RIGHT HALF: Shaded Forest Green -->
    <linearGradient id="leafRightGradient" x1="10%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#1e9740" />
      <stop offset="45%" stop-color="#147b31" />
      <stop offset="85%" stop-color="#0a5921" />
      <stop offset="100%" stop-color="#054016" />
    </linearGradient>

    <!-- 3D AMBER SPHERE RADIAL GRADIENT: Warm Golden Yellow to Rich Deep Orange -->
    <radialGradient id="amberSphereGrad" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fff8b3" />
      <stop offset="22%" stop-color="#ffcc24" />
      <stop offset="58%" stop-color="#f5860b" />
      <stop offset="90%" stop-color="#d45200" />
      <stop offset="100%" stop-color="#b03b00" />
    </radialGradient>

    <!-- AMBER CONNECTOR BAR GRADIENTS -->
    <linearGradient id="stemGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5860b" />
      <stop offset="50%" stop-color="#ffcc24" />
      <stop offset="100%" stop-color="#f5860b" />
    </linearGradient>

    <linearGradient id="stemGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5860b" />
      <stop offset="50%" stop-color="#ffbe1a" />
      <stop offset="100%" stop-color="#db5e00" />
    </linearGradient>
  </defs>

  <!-- ======================================================== -->
  <!-- STANDALONE EXACT SYMBOL: CENTERED ON PURE WHITE CANVAS  -->
  <!-- ======================================================== -->
  <g id="smartpack-exact-symbol">

    <!-- 1. TOP ISOMETRIC BOX FLAP (Parallelogram with rounded vertices) -->
    <path d="M 508,198
             C 522,190 540,192 554,201
             L 662,267
             C 676,276 680,292 671,305
             L 458,414
             C 444,421 428,421 414,414
             L 272,342
             C 258,335 255,319 265,307
             L 472,203
             C 483,197 496,195 508,198 Z"
          fill="url(#topFaceGradient)" />

    <!-- 2. LEFT BOX WALL (Deep Teal packaging facet with smooth concave carve-out) -->
    <path d="M 235,360
             C 220,370 213,386 213,404
             L 213,596
             C 213,644 246,692 288,716
             L 384,772
             C 392,776 401,770 398,761
             C 362,698 334,622 334,540
             C 334,484 352,434 382,388
             C 388,379 382,367 371,368
             L 255,360
             C 248,360 241,360 235,360 Z"
          fill="url(#leftFaceGradient)" />

    <!-- 3. RIGHT BOX WALL (Dark Teal outer wrapper with smooth curved base) -->
    <path d="M 622,416
             C 628,422 628,432 622,438
             C 605,458 594,484 594,514
             C 594,612 648,690 722,720
             C 700,764 654,792 602,792
             C 544,792 494,770 464,734
             L 468,722
             C 486,696 524,630 524,544
             C 524,476 498,428 484,414
             C 478,408 484,398 493,400
             L 622,416 Z"
          fill="url(#rightFaceGradient)" />

    <!-- Right Wall Outer Hex Shell Completion -->
    <path d="M 622,416
             L 728,474
             C 742,482 748,498 748,514
             L 748,652
             C 748,692 724,730 690,750
             L 556,824
             C 532,838 502,838 478,824
             L 464,734
             C 502,768 554,788 602,788
             C 650,788 692,756 712,718
             L 740,524
             C 740,510 734,498 722,490
             L 622,416 Z"
          fill="url(#rightFaceGradient)" />

    <!-- 4. ORGANIC FRESH GREEN LEAF (Formed in the center negative-space cutout) -->
    <!-- Leaf Right Half (Shaded Rich Green Blade) -->
    <path d="M 440,782
             C 455,716 498,648 498,536
             C 498,464 472,412 458,390
             C 464,394 484,424 494,472
             C 510,548 492,668 440,782 Z"
          fill="url(#leafRightGradient)" />

    <!-- Leaf Left Half (Luminous Lime / Emerald Green Curved Blade) -->
    <path d="M 458,390
             C 420,440 372,512 372,596
             C 372,684 406,752 440,782
             C 440,782 492,660 492,536
             C 492,464 472,412 458,390 Z"
          fill="url(#leafLeftGradient)" />

    <!-- Delicate Organic Spine Crease -->
    <path d="M 458,390 C 476,460 482,560 440,782"
          fill="none" stroke="#064e3b" stroke-width="4" stroke-linecap="round" opacity="0.35" />

    <!-- 5. 3D AMBER/ORANGE AI SENSOR MOLECULE (Top-right corner detail) -->
    <g id="amber-ai-nodes">
      <!-- Cylindrical Connecting Arm 1: Anchor Node to Top Node -->
      <path d="M 612,364 L 702,298"
            stroke="url(#stemGrad1)" stroke-width="26" stroke-linecap="round" />

      <!-- Cylindrical Connecting Arm 2: Anchor Node to Right Node -->
      <path d="M 612,364 L 744,402"
            stroke="url(#stemGrad2)" stroke-width="26" stroke-linecap="round" />

      <!-- Cross Fillet Arm -->
      <path d="M 702,298 L 744,402"
            stroke="url(#stemGrad1)" stroke-width="20" stroke-linecap="round" />

      <!-- Node 1: Anchor Sphere (Embedded in packaging corner) -->
      <circle cx="612" cy="364" r="35" fill="url(#amberSphereGrad)" />
      <!-- Specular Highlight Spot -->
      <circle cx="602" cy="354" r="9" fill="#FFFFFF" opacity="0.75" />

      <!-- Node 2: Top Right Sphere -->
      <circle cx="702" cy="298" r="34" fill="url(#amberSphereGrad)" />
      <!-- Specular Highlight Spot -->
      <circle cx="692" cy="288" r="8.5" fill="#FFFFFF" opacity="0.8" />

      <!-- Node 3: Bottom Right Sphere -->
      <circle cx="744" cy="402" r="38" fill="url(#amberSphereGrad)" />
      <!-- Specular Highlight Spot -->
      <circle cx="732" cy="390" r="10" fill="#FFFFFF" opacity="0.75" />
    </g>

  </g>
</svg>
